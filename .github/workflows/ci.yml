name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  build-auth-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-
      - name: Install auth-common
        working-directory: auth-common
        run: mvn -B install -DskipTests

  test:
    needs: build-auth-common
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - account-service
          - transaction-service
          - payment-service
          - fraud-detection-service
          - notification-service
          - auth-service
          - api-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache Maven repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            m2-${{ runner.os }}-
      - name: Re-install auth-common
        working-directory: auth-common
        run: mvn -B install -DskipTests
      - name: Test (auth-service, no wrapper)
        if: matrix.service == 'auth-service'
        working-directory: auth-service
        run: mvn -B test
      - name: Test (wrapper)
        if: matrix.service != 'auth-service'
        working-directory: ${{ matrix.service }}
        run: ./mvnw -B test

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: banking-system-ingress
  namespace: banking-system
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 8080
